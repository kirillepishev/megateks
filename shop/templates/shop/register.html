{% extends 'shop/base.html' %}

{% block title %}Регистрация - Мегатекс{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2 style="margin-bottom: 2rem; color: #c41e3a; text-align: center;">Регистрация клиента</h2>
    
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            {{ form.as_p }}
        </div>
        
        <button type="submit" class="btn" style="width: 100%; padding: 1rem; margin-top: 1rem;">
            Зарегистрироваться
        </button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem;">
        Уже есть аккаунт? <a href="{% url 'login' %}" style="color: #c41e3a; text-decoration: none;">Войти</a>
    </p>
</div>
{% endblock %}
